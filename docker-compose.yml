services:
  db:
    image: postgres:16-alpine
    container_name: investify-db
    environment:
      POSTGRES_USER: investify
      POSTGRES_PASSWORD: investify
      POSTGRES_DB: investify
    ports:
      - "55433:5432"
    volumes:
      - investify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investify -d investify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: investify-redis
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: investify-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://investify:investify@db:5432/investify
      DATABASE_URL_SYNC: postgresql+psycopg2://investify:investify@db:5432/investify
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./apps/web
    container_name: investify-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  investify_db_data:
