[project]
name = "investify-api"
version = "0.1.0"
description = "BIST Investment Intelligence Platform — backend API (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "greenlet>=3.0,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.30",
    "psycopg2-binary>=2.9,<3",
    "httpx>=0.27,<0.29",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.1",
    "yfinance>=0.2.43,<0.3",
    "redis>=5.0,<6",
    "PyYAML>=6.0,<7",
    "python-jose[cryptography]>=3.3,<4",
    "openai>=1.50,<2",
    "google-genai>=1.0,<2",
    "tenacity>=9.0,<10",
    "python-multipart>=0.0.12,<0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-mock>=3.14,<4",
    "respx>=0.21,<0.22",
    "ruff>=0.6,<0.7",
    "aiosqlite>=0.20,<0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
